name: CI/CD Terraform Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- Job 1 : terraform plan ----------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

  # ---------- Job 2 : validation manuelle puis terraform apply ----------
  apply:
    name: Terraform Apply (approbation manuelle)
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      # Étape 1 : créer l'Azure Container Registry
      - name: Creer l'ACR
        run: terraform apply -auto-approve -input=false -target=azurerm_container_registry.acr

      # Étape 2 : construire et pousser l'image Docker dans l'ACR
      - name: Build et push de l'image Docker vers l'ACR
        run: |
          SERVER=$(terraform output -raw acr_login_server)
          USER=$(terraform output -raw acr_admin_username)
          PASS=$(terraform output -raw acr_admin_password)
          echo "::add-mask::$PASS"
          echo "$PASS" | docker login "$SERVER" -u "$USER" --password-stdin
          docker build -t "$SERVER/cr460-app:latest" ./app
          docker push "$SERVER/cr460-app:latest"

      # Étape 3 : déployer le reste
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false